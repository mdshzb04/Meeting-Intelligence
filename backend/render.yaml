services:
  - type: web
    name: meeting-intel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRACEPLANE_API_KEY
        sync: false
      - key: TRACEPLANE_BASE_URL
        value: https://traceplane.shazeb.site/api/v1
